[project]
name = "pywarp10"
version = "0.3.7"
description = "Simplify use of warpscript with python."
authors = [{ name = "Denis Roussel", email = "droussel@centreon.com" }]
requires-python = ">=3.10,<4.0"
dependencies = [
    "py4j>=0",
    "pandas>=2",
    "dateparser>=1.4.1",
    "durations>=0",
    "tqdm>=4.68.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.2.3.241126",
    "ruff>=0.15.18",
    "mypy>=1.20.2",
    "types-dateparser>=1.4.1.20260617",
    "types-requests>=2.33.0.20260508",
    "pytest>=9.1.1",
    "coverage-badge>=1",
    "coverage>=7.14.1",
    "pytest-mock>=3",
    "pytest-cov>=6.1.1",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "inst",
]

[tool.hatch.build.targets.wheel]
exclude = [
    "tests",
    "inst",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
